# One domain for both apps: /api/ goes to the Web API (the Android app), everything else to the MVC portal.
# Install: sudo cp deploy/nginx-klasly.conf /etc/nginx/sites-available/klasly
#          sudo ln -s /etc/nginx/sites-available/klasly /etc/nginx/sites-enabled/
#          replace example.com below, then: sudo nginx -t && sudo systemctl reload nginx
#          then HTTPS: sudo certbot --nginx -d example.com   (certbot edits this file to add port 443)
server {
    listen 80;
    server_name example.com;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
    }
}
